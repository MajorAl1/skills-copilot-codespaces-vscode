# Netlify configuration for Senior Financial Resources.
# This folder is the site root. When the Netlify site is linked to the GitHub repository, set
# "Base directory" = senior-financial-resources in the site settings so Netlify reads this file.
# index.html, manifest.json and service-worker.js are committed build outputs of `node tools/build.js`;
# the build command re-runs it so a content.json edit alone still deploys a consistent site.

[build]
  publish = "."
  command = "node tools/build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Data and worker must never be served stale by the CDN or browser cache; the service worker
# decides what to cache. index.html likewise, so the "newer edition" banner resolves on reload.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
